---
apiVersion: v1
kind: Service
metadata:
  name: aceest-v1
spec:
  selector:
    app.kubernetes.io/name: aceest-fitness
    aceest.io/version: v1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-v2
spec:
  selector:
    app.kubernetes.io/name: aceest-fitness
    aceest.io/version: v2
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-v1
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-ab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-v1
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-v2
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-ACEest-Version"
    nginx.ingress.kubernetes.io/canary-by-header-value: "v2"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-ab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-v2
                port:
                  number: 80
