name: ACEest Fitness CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: aceest-fitness
  PYTHON_VERSION: "3.11"

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile sources (syntax check)
        run: python -m compileall -q app.py fitness.py models.py tests

      - name: Lint with flake8
        run: |
          flake8 app.py fitness.py models.py tests --count --select=E9,F63,F7,F82 --show-source
          flake8 app.py fitness.py models.py tests --count --statistics

      - name: Run Pytest on the runner
        run: pytest --cov=. --cov-report=term-missing

  docker-build-and-test:
    name: Docker Assembly & Containerised Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Pytest inside the container
        run: docker run --rm ${{ env.IMAGE_NAME }}:test pytest -v

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test the running container
        run: |
          docker run -d --name aceest-smoke -p 5000:5000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo "Health check passed"
              docker rm -f aceest-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to become healthy"
          docker logs aceest-smoke
          docker rm -f aceest-smoke
          exit 1
