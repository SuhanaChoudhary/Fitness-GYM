---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
spec:
  selector:
    app.kubernetes.io/name: aceest-fitness
    aceest.io/track: primary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
spec:
  selector:
    app.kubernetes.io/name: aceest-fitness
    aceest.io/track: shadow
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-primary
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.aceest-shadow.svc.cluster.local$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-shadow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-primary
                port:
                  number: 80
